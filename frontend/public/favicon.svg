<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SYSTRA favicon — matches src/components/BrandMark.jsx but tuned for
       16–32px: chunkier candles, no hairline grid, brighter arrow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131F38"/>
      <stop offset="100%" stop-color="#0C1322"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2FBF63"/>
      <stop offset="100%" stop-color="#52E087"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="rgba(82,224,135,0.45)" stroke-width="1.5"/>

  <!-- Ascending candles (bold for small sizes) -->
  <line x1="9" y1="14" x2="9" y2="27" stroke="#2FBF63" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="6.2" y="16.5" width="5.6" height="8.5" rx="1.4" fill="#2FBF63"/>

  <line x1="16" y1="9" x2="16" y2="23" stroke="#2FBF63" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="13.2" y="11.5" width="5.6" height="8.5" rx="1.4" fill="#3BD273"/>

  <line x1="23" y1="4.5" x2="23" y2="18.5" stroke="#52E087" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="20.2" y="7" width="5.6" height="8.5" rx="1.4" fill="#52E087"/>

  <!-- Breakout arrow: dark halo then bright stroke, so it pops off the candles -->
  <path d="M5 27 L12.5 20.5 L17 23 L26.5 11" fill="none" stroke="#0C1322" stroke-opacity="0.95" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M5 27 L12.5 20.5 L17 23 L26.5 11" fill="none" stroke="url(#arrow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27.5 16.2 L27.5 10.6 L22.2 10.6" fill="none" stroke="#0C1322" stroke-opacity="0.95" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(9 27.5 10.6)"/>
  <path d="M27.5 16.2 L27.5 10.6 L22.2 10.6" fill="none" stroke="#52E087" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(9 27.5 10.6)"/>
</svg>
